# `docker compose up` starts everything needed to work on the site:
#   web  http://localhost:5173  Vite + the API worker in the Workers runtime, both hot-reloading
#   db   localhost:5432         Postgres (user combi, no password needed)
# Run the scraper or anything else Rust with: docker compose run --rm dev <command>

x-rust: &rust
  build: .
  environment:
    # compile-time database for sqlx's query! macros, and the runtime database
    DATABASE_URL: postgres://combi@db/combi
  volumes:
    - .:/workspace
    - cargo-registry:/usr/local/cargo/registry
    - cargo-git:/usr/local/cargo/git
    - target:/target

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: combi
      POSTGRES_DB: combi
      # dev only: matches the passwordless postgres://combi@localhost URL in .env
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "combi"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    <<: *rust
    command: sqlx migrate run
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-bookworm-slim
    working_dir: /workspace/web
    command: sh -c "npm ci && npm run dev"
    environment:
      # the worker's Hyperdrive binding connects here instead of localhost (see wrangler.jsonc)
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://combi:combi@db:5432/combi
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # a shell with the Rust toolchain; not started by `up`
  dev:
    <<: *rust
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://combi@db/combi
      CARGO_TARGET_DIR: /target/dev
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  pgdata:
  cargo-registry:
  cargo-git:
  target:
  web-node-modules:
