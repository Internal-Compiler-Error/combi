[package]
name = "combi"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.3", features = ["derive"] }
color-eyre = "0.6.3"
console-subscriber = "0.5.0"
iter_tools = "0.50.0"
lazy_static = "1.4.0"
rand = "0.8.5"
rand_distr = "0.4.3"
regex = "1.10.3"
reqwest = "0.13.4"
scraper = "0.27.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
tokio = { version = "1.36.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
